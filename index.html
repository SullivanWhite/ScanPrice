<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanPrice — Cazador de Gangas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --bg2: #141417;
    --bg3: #1c1c21;
    --bg4: #242429;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eee8;
    --text2: #9a9890;
    --text3: #5c5b58;
    --accent: #e8c547;
    --accent2: #b89a2a;
    --green: #4caf7d;
    --red: #e05a5a;
    --blue: #5b9bd5;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 58px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .logo span { color: var(--text2); font-weight: 400; }
  .header-stats {
    display: flex;
    gap: 1.5rem;
    font-size: 12px;
    color: var(--text2);
    font-family: var(--mono);
  }
  .header-stats b { color: var(--text); }

  /* ── LAYOUT ── */
  .page-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 1.5rem;
    align-items: start;
  }
  .container {
    min-width: 0;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    position: sticky;
    top: 74px;
  }
  .sidebar-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header span { color: var(--text3); font-weight: 400; }
  .sidebar-list {
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--bg4) transparent;
  }
  .sidebar-item {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    cursor: default;
  }
  .sidebar-item:last-child { border-bottom: none; }
  .sidebar-item:hover { background: var(--bg3); }
  .sidebar-item-name {
    font-size: 12px;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-item-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-item-precio {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .sidebar-item-fecha {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
  }
  .sidebar-empty {
    padding: 2rem 1rem;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    line-height: 2;
  }
  @media (max-width: 900px) {
    .page-wrapper { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .sidebar-list { max-height: 300px; }
  }

  /* ── ADD FORM ── */
  .add-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }
  .add-panel h2 {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 2.5fr 1fr auto auto;
    gap: 10px;
    align-items: end;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 5px;
    font-family: var(--mono);
  }
  input[type="text"], input[type="number"], input[type="url"] {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 7px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text3); }
  .btn {
    padding: 9px 18px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: opacity .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    color: #0d0d0f;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-scan {
    background: var(--bg4);
    color: var(--text2);
    border: 1px solid var(--border2);
    font-family: var(--mono);
    font-size: 12px;
  }
  .btn-scan:hover { color: var(--text); border-color: var(--accent); }
  .preview-chip {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text2);
  }
  .preview-chip img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
  .preview-chip.show { display: flex; }
  .preview-chip .pname { color: var(--text); font-weight: 500; }
  .preview-chip .pprice {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    font-weight: 700;
  }
  .preview-chip .ptienda {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg4);
    color: var(--text3);
    font-family: var(--mono);
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .toolbar h2 {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--text3);
    text-transform: uppercase;
    flex: 1;
  }
  .btn-refresh {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .2s;
  }
  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* ── CARD ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s, transform .2s;
    position: relative;
  }
  .card:hover { border-color: var(--border2); transform: translateY(-2px); }
  .card.ganga { border-color: rgba(76,175,125,0.4); }
  .card.ganga::before {
    content: '🎯 GANGA';
    position: absolute;
    top: 10px; left: 10px;
    background: var(--green);
    color: #0d0d0f;
    font-size: 10px;
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 4px;
    z-index: 2;
  }
  .card-img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: var(--bg3);
    display: block;
  }
  .card-img-placeholder {
    width: 100%;
    height: 150px;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .card-body { padding: 14px; }
  .card-tienda {
    font-size: 10px;
    font-family: var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .tienda-goblin { color: #6ab04c; }
  .tienda-dungeon { color: #7b68ee; }
  .tienda-mathom { color: #e67e22; }
  .tienda-otra { color: var(--text3); }
  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-prices {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 12px;
  }
  .price-actual {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .price-actual.caro { color: var(--red); }
  .price-actual.ganga { color: var(--green); }
  .price-objetivo {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    line-height: 1;
    margin-bottom: 2px;
  }
  .price-objetivo span { color: var(--text2); }
  .card-diff {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: auto;
  }
  .diff-green { background: rgba(76,175,125,0.15); color: var(--green); }
  .diff-red { background: rgba(224,90,90,0.12); color: var(--red); }
  .card-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .btn-link {
    font-size: 12px;
    color: var(--blue);
    text-decoration: none;
    font-family: var(--mono);
  }
  .btn-link:hover { color: var(--text); }
  .btn-del {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px;
    border-radius: 4px;
    transition: color .15s;
  }
  .btn-del:hover { color: var(--red); }
  .card-error {
    font-size: 12px;
    color: var(--red);
    font-family: var(--mono);
  }
  .card-minimo {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
  }
  .card-minimo .min-val {
    color: #5b9bd5;
    font-weight: 700;
    font-size: 12px;
  }
  .card-minimo .min-label { letter-spacing: 0.06em; }
  .scanning-overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,13,15,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    gap: 8px;
  }
  .dot-anim::after {
    content: '';
    animation: dots 1.2s infinite;
  }
  @keyframes dots {
    0%   { content: '.'; }
    33%  { content: '..'; }
    66%  { content: '...'; }
  }

  /* ── EMPTY STATE ── */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 2;
  }
  .empty .big { font-size: 48px; margin-bottom: 1rem; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--bg4);
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 13px;
    font-family: var(--mono);
    z-index: 999;
    display: none;
    animation: fadein .2s ease;
  }
  @keyframes fadein { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

  /* ── STATUS BAR ── */
  .statusbar {
    text-align: center;
    padding: 0.5rem;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    margin-top: 3rem;
  }

  @media (max-width: 700px) {
    .form-row { grid-template-columns: 1fr 1fr; }
    .form-row .field:nth-child(2) { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">SCAN<span>PRICE</span> <span style="color:var(--text3);font-size:11px;">v2.0</span></div>
  <div class="header-stats">
    <span>Productos: <b id="stat-total">—</b></span>
    <span>Gangas: <b id="stat-gangas" style="color:var(--green)">—</b></span>
    <span>Caros: <b id="stat-caros" style="color:var(--red)">—</b></span>
  </div>
</header>

<div class="page-wrapper">
<div class="container">

  <!-- AÑADIR PRODUCTO -->
  <div class="add-panel">
    <h2>// añadir producto</h2>
    <div class="form-row">
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="inp-nombre" placeholder="Catan, Gloomhaven...">
      </div>
      <div class="field">
        <label>URL de la tienda</label>
        <input type="url" id="inp-url" placeholder="https://goblintrader.es/products/...">
      </div>
      <div class="field">
        <label>Precio objetivo (€)</label>
        <input type="number" id="inp-precio" placeholder="49.99" step="0.01" min="0">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn btn-scan" onclick="previewScan()">⚡ Testear</button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn btn-primary" onclick="addProducto()">+ Guardar</button>
      </div>
    </div>
    <div class="preview-chip" id="preview">
      <img id="prev-img" src="" alt="">
      <div>
        <div class="pname" id="prev-name">—</div>
        <div class="ptienda" id="prev-tienda">—</div>
      </div>
      <div class="pprice" id="prev-price">—</div>
    </div>
  </div>

  <!-- LISTA -->
  <div class="toolbar">
    <h2>// watchlist</h2>
    <button class="btn-refresh" id="btn-refresh" onclick="scanAll()">
      <span id="refresh-icon">↻</span> Escanear todos
    </button>
  </div>

  <div class="grid" id="grid">
    <div class="empty">
      <div class="big">🎲</div>
      <div>No hay productos en la lista.</div>
      <div>Pega una URL arriba y empieza a cazar gangas.</div>
    </div>
  </div>

  <div class="statusbar" id="statusbar">Listo.</div>
</div><!-- /.container -->

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-panel">
    <div class="sidebar-header">
      // últimos añadidos <span id="sidebar-count"></span>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="sidebar-empty">Cargando...</div>
    </div>
  </div>
</aside>

</div><!-- /.page-wrapper -->

<div id="toast"></div>

<script>
const API = 'http://localhost:5000/api';
let productos = [];

function toast(msg, duration=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', duration);
}

function tiendaClass(tienda) {
  if (!tienda) return 'tienda-otra';
  const t = tienda.toLowerCase();
  if (t.includes('goblin')) return 'tienda-goblin';
  if (t.includes('dungeon')) return 'tienda-dungeon';
  if (t.includes('mathom')) return 'tienda-mathom';
  return 'tienda-otra';
}

function renderCard(p, idx, scanning=false, stats=null) {
  const tieneActual = p.precio_actual != null;
  const esGanga = tieneActual && p.precio_actual <= p.precio_objetivo;
  const diff = tieneActual ? (p.precio_actual - p.precio_objetivo).toFixed(2) : null;

  const imgHtml = p.imagen
    ? `<img class="card-img" src="${p.imagen}" alt="${p.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const placeholder = `<div class="card-img-placeholder" ${p.imagen ? 'style="display:none"' : ''}>🎲</div>`;

  let priceHtml = '';
  if (!tieneActual) {
    priceHtml = `<div class="card-error">— sin precio</div>`;
  } else {
    const cls = esGanga ? 'ganga' : 'caro';
    priceHtml = `
      <div class="card-prices">
        <div>
          <div class="price-actual ${cls}">${p.precio_actual.toFixed(2)} €</div>
        </div>
        <div>
          <div class="price-objetivo">objetivo <span>${p.precio_objetivo.toFixed(2)} €</span></div>
          <div class="card-diff ${esGanga ? 'diff-green' : 'diff-red'}">
            ${diff > 0 ? '+' : ''}${diff} €
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="card ${esGanga ? 'ganga' : ''}" id="card-${idx}">
      ${imgHtml}${placeholder}
      <div class="card-body">
        <div class="card-tienda ${tiendaClass(p.tienda)}">${p.tienda || '—'}</div>
        <div class="card-name">${p.nombre}</div>
        ${priceHtml}
        ${stats && stats.n > 1 ? `
        <div class="card-minimo">
          <span class="min-label">mín. histórico</span>
          <span class="min-val">${stats.min.toFixed(2)} €</span>
          <span style="margin-left:auto;color:var(--text3)">${stats.n} registros</span>
        </div>` : stats && stats.n === 1 ? `
        <div class="card-minimo">
          <span class="min-label">1er registro</span>
          <span class="min-val">${stats.min.toFixed(2)} €</span>
        </div>` : ''}
        <div class="card-footer">
          <a class="btn-link" href="${p.url}" target="_blank">↗ ver tienda</a>
          <button class="btn-del" onclick="deleteProducto(${idx})" title="Eliminar">✕</button>
        </div>
      </div>
      ${scanning ? '<div class="scanning-overlay"><span class="dot-anim">escaneando</span></div>' : ''}
    </div>`;
}

async function renderGrid() {
  const grid = document.getElementById('grid');
  if (!productos.length) {
    grid.innerHTML = `<div class="empty"><div class="big">🎲</div><div>No hay productos en la lista.</div><div>Pega una URL arriba y empieza a cazar gangas.</div></div>`;
    return;
  }
  // Cargar historial de todos los productos en paralelo
  const historialesRaw = await Promise.all(
    productos.map(p =>
      fetch(`${API}/historial/${encodeURIComponent(p.nombre)}`)
        .then(r => r.json())
        .catch(() => ({ stats: null }))
    )
  );
  grid.innerHTML = productos.map((p, i) => renderCard(p, i, false, historialesRaw[i].stats)).join('');
  updateStats();
}

function updateStats() {
  const total = productos.length;
  const conPrecio = productos.filter(p => p.precio_actual != null);
  const gangas = conPrecio.filter(p => p.precio_actual <= p.precio_objetivo).length;
  const caros = conPrecio.filter(p => p.precio_actual > p.precio_objetivo).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-gangas').textContent = gangas;
  document.getElementById('stat-caros').textContent = caros;
}

async function cargarProductos() {
  try {
    const r = await fetch(`${API}/productos`);
    productos = await r.json();
    renderGrid();
  } catch(e) {
    document.getElementById('statusbar').textContent = '⚠ No se puede conectar con el servidor (¿está corriendo server.py?)';
  }
}

async function previewScan() {
  const url = document.getElementById('inp-url').value.trim();
  if (!url) { toast('Introduce una URL primero'); return; }
  const preview = document.getElementById('preview');
  preview.className = 'preview-chip show';
  document.getElementById('prev-name').textContent = 'Escaneando...';
  document.getElementById('prev-tienda').textContent = '—';
  document.getElementById('prev-price').textContent = '—';
  document.getElementById('prev-img').src = '';

  try {
    const r = await fetch(`${API}/scan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await r.json();
    if (data.ok) {
      document.getElementById('prev-name').textContent = data.nombre_scrapeado || url;
      document.getElementById('prev-tienda').textContent = data.tienda;
      document.getElementById('prev-price').textContent = data.precio ? data.precio.toFixed(2) + ' €' : '—';
      if (data.imagen) document.getElementById('prev-img').src = data.imagen;
      // Rellenar nombre automáticamente si está vacío
      const inpNombre = document.getElementById('inp-nombre');
      if (!inpNombre.value && data.nombre_scrapeado) {
        inpNombre.value = data.nombre_scrapeado.substring(0, 60);
      }
    } else {
      document.getElementById('prev-name').textContent = '⚠ ' + (data.error || 'Error desconocido');
    }
  } catch(e) {
    document.getElementById('prev-name').textContent = '⚠ Error de conexión';
  }
}

async function addProducto() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const url = document.getElementById('inp-url').value.trim();
  const precio_objetivo = parseFloat(document.getElementById('inp-precio').value);

  if (!nombre || !url || isNaN(precio_objetivo)) {
    toast('Rellena todos los campos'); return;
  }

  // Obtener imagen/tienda si está en preview
  const prevImg = document.getElementById('prev-img').src;
  const prevTienda = document.getElementById('prev-tienda').textContent;

  const producto = {
    nombre, url, precio_objetivo,
    imagen: prevImg && !prevImg.endsWith('localhost:5000/api') ? prevImg : null,
    tienda: prevTienda !== '—' ? prevTienda : null,
    precio_actual: null
  };

  try {
    const r = await fetch(`${API}/productos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(producto)
    });
    const data = await r.json();
    if (data.ok) {
      toast('✓ Producto guardado');
      document.getElementById('inp-nombre').value = '';
      document.getElementById('inp-url').value = '';
      document.getElementById('inp-precio').value = '';
      document.getElementById('preview').className = 'preview-chip';
      await cargarProductos();
cargarSidebar();
    } else {
      toast('⚠ ' + (data.error || 'Error al guardar'));
    }
  } catch(e) {
    toast('⚠ Error de conexión');
  }
}

async function deleteProducto(idx) {
  if (!confirm(`¿Eliminar "${productos[idx].nombre}"?`)) return;
  try {
    const r = await fetch(`${API}/productos/${idx}`, { method: 'DELETE' });
    const data = await r.json();
    if (data.ok) {
      toast(`✓ "${data.nombre}" eliminado`);
      await cargarProductos();
    }
  } catch(e) {
    toast('⚠ Error al eliminar');
  }
}

async function scanAll() {
  if (!productos.length) { toast('No hay productos'); return; }
  const btn = document.getElementById('btn-refresh');
  const icon = document.getElementById('refresh-icon');
  btn.disabled = true;
  icon.classList.add('spin');
  document.getElementById('statusbar').textContent = `Escaneando ${productos.length} producto(s)...`;

  try {
    const r = await fetch(`${API}/scan-all`);
    const datos = await r.json();
    productos = datos;

    const gangas = datos.filter(p => p.precio_actual != null && p.precio_actual <= p.precio_objetivo);
    renderGrid();
    document.getElementById('statusbar').textContent =
      `Último escaneo: ${new Date().toLocaleTimeString('es-ES')} · ${gangas.length} ganga(s) encontrada(s)`;
    if (gangas.length > 0) {
      toast(`🎯 ${gangas.length} ganga(s) encontrada(s)!`, 5000);
    } else {
      toast('Escaneo completado. Sin gangas de momento.');
    }
  } catch(e) {
    toast('⚠ Error de conexión con el servidor');
  } finally {
    btn.disabled = false;
    icon.classList.remove('spin');
  }
}

// Enter en URL lanza preview
document.getElementById('inp-url').addEventListener('keydown', e => {
  if (e.key === 'Enter') previewScan();
});

cargarProductos();
cargarSidebar();

async function cargarSidebar() {
  try {
    const r = await fetch(`${API}/ultimos-anyadidos`);
    const data = await r.json();
    const lista = document.getElementById('sidebar-list');
    const count = document.getElementById('sidebar-count');

    if (!data.length) {
      lista.innerHTML = '<div class="sidebar-empty">La base de datos<br>está vacía.</div>';
      return;
    }

    count.textContent = `(${data.length})`;
    lista.innerHTML = data.map(item => {
      const fecha = new Date(item.fecha).toLocaleDateString('es-ES', {
        day: '2-digit', month: '2-digit', year: '2-digit'
      });
      return `
        <div class="sidebar-item" title="${item.nombre}">
          <div class="sidebar-item-name">${item.nombre}</div>
          <div class="sidebar-item-meta">
            <span class="sidebar-item-precio">${item.precio.toFixed(2)} €</span>
            <span class="sidebar-item-fecha">${fecha}</span>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('sidebar-list').innerHTML =
      '<div class="sidebar-empty">Sin conexión<br>con el servidor.</div>';
  }
}
</script>
